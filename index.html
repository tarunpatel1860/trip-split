<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="A tiny offline-first expense splitter for trips.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Trip Split">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Trip Split</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast" hidden></div>
  <div id="updateBar" class="update-bar" role="status" aria-live="polite" hidden>
    <span class="grow">A new version of Trip Split is ready.</span>
    <button class="primary sm" id="updateNow">Update</button>
    <button class="ghost sm" id="updateLater">Later</button>
  </div>

  <script src="logic.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (registration) {
          registration.update().catch(function () {});
        }).catch(function () {});
      });
    }
  </script>
</body>
</html>
